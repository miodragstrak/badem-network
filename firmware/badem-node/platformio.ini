[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<badem-node-poc.ino> +<badem-node-poc.ino.cpp>
lib_deps =
    bblanchon/ArduinoJson@6.21.5
    https://github.com/torrey-xyz/solduino.git#ad0d621f954a1a4eb1870cd62e8f9c839953280c
